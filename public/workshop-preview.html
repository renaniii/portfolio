<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <title>Preview da oficina</title>
    <style>
      html,
      body,
      #stage,
      #stage iframe {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      html,
      body {
        min-height: 100%;
        overflow: hidden;
        background: #fff;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      #stage iframe {
        display: block;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <iframe
        id="preview"
        title="Resultado do código"
        sandbox="allow-scripts"
        referrerpolicy="no-referrer"
      ></iframe>
    </div>

    <script>
      const preview = document.getElementById('preview')

      const render = (html) => {
        if (typeof html !== 'string') return
        preview.srcdoc = html
      }

      window.addEventListener('message', (event) => {
        if (event.source !== window.parent) return
        if (!event.data || event.data.type !== 'workshop-preview') return

        render(event.data.html)
      })

      window.parent.postMessage({ type: 'workshop-preview-ready' }, '*')
    </script>
  </body>
</html>
